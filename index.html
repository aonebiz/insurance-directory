<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보험인력">
<meta name="theme-color" content="#1a2744">
<title>보험사 인력 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --navy: #1a2744;
    --navy-light: #243357;
    --navy-mid: #2e4070;
    --accent: #4f8ef7;
    --accent-light: #7ab0ff;
    --gold: #e8b84b;
    --bg: #f0f3fa;
    --white: #ffffff;
    --gray: #8892a4;
    --text: #1a2744;
    --border: #dde3f0;
    --card-bg: #ffffff;
    --mobile-color: #2c9e6b;
    --office-color: #4f8ef7;
  }

  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    padding: 16px 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(26,39,68,0.3);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-icon {
    width: 36px; height: 36px;
    background: var(--gold);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header h1 {
    color: white;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header h1 span {
    color: var(--gold);
  }
  .count-badge {
    background: rgba(255,255,255,0.15);
    color: var(--accent-light);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  /* SEARCH */
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray);
    font-size: 16px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px 40px 12px 42px;
    font-size: 16px;
    color: white;
    outline: none;
    transition: all 0.2s;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.5); }
  .search-input:focus {
    background: rgba(255,255,255,0.18);
    border-color: var(--accent-light);
  }
  .clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.6);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: none;
    line-height: 1;
    padding: 4px;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab {
    flex: 1;
    padding: 10px 4px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    transition: all 0.2s;
    font-family: inherit;
  }
  .tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .tab-count {
    font-size: 11px;
    opacity: 0.8;
    margin-left: 3px;
  }

  /* CONTENT */
  .content {
    padding: 12px;
    padding-bottom: 20px;
  }

  /* STATS BAR */
  .stats-bar {
    background: white;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 6px rgba(26,39,68,0.07);
  }
  .stats-text {
    font-size: 13px;
    color: var(--gray);
  }
  .stats-text strong {
    color: var(--navy);
    font-weight: 700;
  }
  .sort-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--gray);
    cursor: pointer;
    font-family: inherit;
  }

  /* COMPANY GROUP */
  .company-group { margin-bottom: 10px; }
  .company-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
  }
  .company-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.2px;
  }
  .company-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .company-count {
    font-size: 11px;
    color: var(--gray);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* PERSON CARD */
  .card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 8px;
    box-shadow: 0 1px 8px rgba(26,39,68,0.08);
    border: 1px solid rgba(26,39,68,0.05);
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-touch-callout: none;
  }
  .card:active {
    transform: scale(0.99);
    box-shadow: 0 1px 4px rgba(26,39,68,0.05);
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .person-info { flex: 1; }
  .person-name {
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.3px;
    line-height: 1.2;
  }
  .person-position {
    font-size: 12px;
    color: var(--gray);
    margin-top: 3px;
  }
  .bojong-badge {
    background: var(--navy);
    color: white;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .dept-text {
    font-size: 12px;
    color: #6b7a9e;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .work-badge {
    display: inline-block;
    background: rgba(79,142,247,0.1);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  /* PHONE BUTTONS */
  .phone-row {
    display: flex;
    gap: 8px;
  }
  .phone-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 8px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .phone-btn:active { opacity: 0.8; transform: scale(0.98); }
  .btn-mobile {
    background: rgba(44,158,107,0.1);
    color: var(--mobile-color);
    border: 1px solid rgba(44,158,107,0.2);
  }
  .btn-office {
    background: rgba(79,142,247,0.1);
    color: var(--office-color);
    border: 1px solid rgba(79,142,247,0.2);
  }
  .btn-disabled {
    background: var(--bg);
    color: #ccc;
    border: 1px solid var(--border);
    cursor: not-allowed;
    pointer-events: none;
  }
  .phone-icon { font-size: 14px; }
  .phone-label { font-size: 10px; opacity: 0.7; }

  /* NOTE BADGE */
  .note-badge {
    display: inline-block;
    background: rgba(232,184,75,0.15);
    color: #a07c1a;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 5px;
    margin-top: 6px;
    font-weight: 600;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--gray);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .empty p { font-size: 14px; }

  /* HIGHLIGHT */
  .hl { background: rgba(232,184,75,0.35); border-radius: 3px; padding: 0 1px; }
</style>
</head>

<div class="header">
  <div class="header-top">
    <div class="header-title">
      <div class="header-icon">🏢</div>
      <h1>보험사 <span>인력현황</span></h1>

  </div>
</div>

<div class="content">

  <div id="listContainer"></div>
</div>

let currentTab = 'all';
let searchQuery = '';

function getTabData(tab) {
  if (tab === 'all') return [...DATA['손보'], ...DATA['생보'], ...DATA['공제']];
  return DATA[tab] || [];
}

function highlight(text, query) {
  if (!query || !text) return text || '';
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text).replace(new RegExp(`(${escaped})`, 'gi'), '<span class="hl">$1</span>');
}

function search(data, query) {
  if (!query) return data;
  const q = query.toLowerCase();
  return data.filter(p =>
    (p.name && p.name.toLowerCase().includes(q)) ||
    (p.company && p.company.toLowerCase().includes(q)) ||
    (p.dept && p.dept.toLowerCase().includes(q)) ||
    (p.position && p.position.toLowerCase().includes(q)) ||
    (p.bojong && p.bojong.toLowerCase().includes(q)) ||
    (p.work && p.work.toLowerCase().includes(q)) ||
    (p.mobile && p.mobile.includes(q)) ||
    (p.office && p.office.includes(q))
  );
}

function renderCard(p, query) {
  const mobileBtn = p.mobile
    ? `<a href="tel:${p.mobile}" class="phone-btn btn-mobile"><span class="phone-icon">📱</span><span>${highlight(p.mobile, query)}</span></a>`
    : `<div class="phone-btn btn-disabled"><span class="phone-icon">📱</span><span>없음</span></div>`;
  
  const officeBtn = p.office && !p.office.includes('내선')
    ? `<a href="tel:${p.office}" class="phone-btn btn-office"><span class="phone-icon">☎️</span><span>${highlight(p.office, query)}</span></a>`
    : p.office
    ? `<div class="phone-btn btn-office" style="cursor:default"><span class="phone-icon">☎️</span><span>${p.office}</span></div>`
    : `<div class="phone-btn btn-disabled"><span class="phone-icon">☎️</span><span>없음</span></div>`;

  const workBadge = p.work ? `<div class="work-badge">${highlight(p.work, query)}</div>` : '';
  const noteBadge = p.note ? `<div class="note-badge">📌 ${p.note}</div>` : '';

  return `
    <div class="card">
      <div class="card-top">
        <div class="person-info">
          <div class="person-name">${highlight(p.name, query)}</div>
          <div class="person-position">${highlight(p.position, query)}</div>
        </div>
        <div class="bojong-badge">${highlight(p.bojong, query)}</div>
      </div>
      <div class="dept-text">${highlight(p.company, query)} · ${highlight(p.dept, query)}</div>
      ${workBadge}
      <div class="phone-row">${mobileBtn}${officeBtn}</div>
      ${noteBadge}
    </div>
  `;
}

function render() {
  const allData = getTabData(currentTab);
  const filtered = search(allData, searchQuery);

  // Group by company
  const groups = {};
  filtered.forEach(p => {
    if (!groups[p.company]) groups[p.company] = [];
    groups[p.company].push(p);
  });

  let html = '';
  if (filtered.length === 0) {
    html = `<div class="empty">
      <div class="empty-icon">🔍</div>
      <h3>검색 결과 없음</h3>
      <p>"${searchQuery}"에 해당하는 인력이 없습니다.</p>
    </div>`;
  } else {
    Object.entries(groups).forEach(([company, people]) => {
      html += `<div class="company-group">
        <div class="company-header">
          <div class="company-name">${highlight(company, searchQuery)}</div>
          <div class="company-line"></div>
          <div class="company-count">${people.length}명</div>
        </div>`;
      people.forEach(p => { html += renderCard(p, searchQuery); });
      html += '</div>';
    });
  }

  document.getElementById('listContainer').innerHTML = html;
  document.getElementById('resultCount').textContent = `${filtered.length}명`;

  // Update tab counts
  const allFiltered = search(getTabData('all'), searchQuery);
  const sonboFiltered = search(DATA['손보'], searchQuery);
  const saengboFiltered = search(DATA['생보'], searchQuery);
  const gongjeFiltered = search(DATA['공제'], searchQuery);
  document.getElementById('cnt-all').textContent = ` ${allFiltered.length}`;
  document.getElementById('cnt-손보').textContent = ` ${sonboFiltered.length}`;
  document.getElementById('cnt-생보').textContent = ` ${saengboFiltered.length}`;
  document.getElementById('cnt-공제').textContent = ` ${gongjeFiltered.length}`;
  document.getElementById('totalCount').textContent = `총 ${allFiltered.length}명`;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  render();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('clearBtn').style.display = 'none';
  render();
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  searchQuery = e.target.value.trim();
  document.getElementById('clearBtn').style.display = searchQuery ? 'block' : 'none';
  render();
});

// Initial render
render();
</script>
